services:
  db:
    image: postgres:16
    container_name: civilens_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-civilens}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
      image: dpage/pgadmin4:7
      container_name: civilens_pgadmin
      restart: always
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@example.com
        PGADMIN_DEFAULT_PASSWORD: admin
      ports:
        - "5050:80"
      depends_on:
        - db

  web:
    build:
      context: ./CiviLens.Backend
      dockerfile: Dockerfile
    container_name: civilens_backend
    command: sh /entrypoint.sh
    volumes:
      - ./CiviLens.Backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./CiviLens.Backend/.env
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy

  vectordb:
    image: qdrant/qdrant:latest
    container_name: civilens_vectordb
    restart: always
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/collections || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  qdrant_storage:
